<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Cartes de jeu</title>

    <!-- Lien vers le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="cards">

        <!-- As de pique -->
        <div class="card card-front black">
            <div class="top">
                A ♠
            </div>

            <div class="center figure">
                ♠
            </div>

            <div class="bottom">
                A ♠
            </div>
        </div>


        <!-- 2 de pique -->
        <div class="card card-front black">
            <div class="top">
                2 ♠
            </div>

            <div class="center number">
                2 ♠
            </div>

            <div class="bottom">
                2 ♠
            </div>
        </div>


        <!-- As de trèfle -->
        <div class="card card-front black">
            <div class="top">
                A ♣
            </div>

            <div class="center figure">
                ♣
            </div>

            <div class="bottom">
                A ♣
            </div>
        </div>


        <!-- 7 de trèfle -->
        <div class="card card-front black">
            <div class="top">
                7 ♣
            </div>

            <div class="center number">
                7 ♣
            </div>

            <div class="bottom">
                7 ♣
            </div>
        </div>


        <!-- Roi de cœur -->
        <div class="card card-front red">
            <div class="top">
                K ♥
            </div>

            <div class="center figure">
                K
            </div>

            <div class="bottom">
                K ♥
            </div>
        </div>


        <!-- Valet de carreau -->
        <div class="card card-front red">
            <div class="top">
                J ♦
            </div>

            <div class="center figure">
                J
            </div>

            <div class="bottom">
                J ♦
            </div>
        </div>


        <!-- Dos de la carte -->
        <div class="card card-back"></div>

    </div>

</body>

</html>
